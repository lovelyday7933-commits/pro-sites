# 사용자 구매 2026-09-08. canonical 은 절대 URL 자기참조여야 한다(SEO 기준).
baseURL = "https://prostock.kr/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
# 사용자 2026-09-10: "네이밍 프로 주식, 프로 코인 으로 일단 해. 이건 나중에 바꿔도 되잖아."
# ⚠️임시 이름이다. 바꿀 때 여기 한 곳만 고치면 title·og·JSON-LD 저자/발행처가 함께 따라온다.
title = "프로 주식"
themesDir = "../_themes"
theme = "base"

enableGitInfo = false          # ⛔true 로 두면 Actions 에서 fetch-depth:0 이 필요해진다(비용 조항 3번)
enableRobotsTXT = true
buildFuture = false            # publishDate 가 미래면 빌드에서 뺀다 = 예약 발행의 근거
summaryLength = 40

[pagination]
  pagerSize = 12

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  # 네이버 서치어드바이저 소유확인 — ⛔지우면 확인이 풀린다
  naverVerification = "b1e5df6efdc24ef4196c29dac913e2920f2f6aca"
  site = "stock"
  # 홈 제목 띠의 큰 제목(검색어 먼저) · 헤더 로고 옆 작은 글. 없으면 사이트 이름만 나간다(코인).
  headline = "차트 신호 종목별 실측"
  tagline = "차트 신호 종목별 실측"
  # ⚠️2026-09-09 까지 빈 문자열이었다 = 홈·목록에 meta description 이 아예 없었다.
  # ⛔2026-09-13 "아무 날" 금지(사용자) — 비교 기준은 "평소"
  description = "골든크로스·RSI·볼린저밴드·거래량 급증처럼 이름은 익숙한데 실제로 어땠는지는 잘 모르는 차트 신호 16가지. 390여 개 종목의 36년 치 일봉에서 신호 보고 샀을 때와 평소에 샀을 때를 나란히 놓고 숫자로 확인합니다."
  # 책 신청 창구 — 사용자 지급 2026-09-08. 사이트마다 다른 양식이라
  # 이 링크 하나로 주식/코인 세그먼트가 갈린다.
  ctaURL = "https://proreport.co.kr/f/wvptb0wl"

  # ⛔2026-09-14 [params.defaultCTA](기본 책 안내)를 뺐다 — 페이지 종류·신호별 책·장은 data/bookmap.json(tools/bookmap.py · 책 본문 대조),
  #   신청 유도 문구는 data/copy.json(codex · tools/cta_copy.py), 공증 기록은 data/proof.json(tools/proof.py). 템플릿 = partials/cta/*.
[params.home]
  # ★2026-09-13 홈 찾기 칸 아래 바로가기 — 종목 코드. grid.json 에 없는 코드는 템플릿이 건너뛴다.
  quick = ["005930", "000660", "035420", "068270", "086520"]

# ★2026-09-13 /search.json — 종목 찾기 창·홈 점그림 풀이가 쓰는 목록(layouts/index.search.json).
#   배포 파일 +1. ⛔코인은 이 블록이 없다(격자가 없다).
[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

# ★2026-09-14 사이트맵을 종류별로 나눈다 — sitemap.xml 은 목차가 되고 아래 파일을 가리킨다(layouts/sitemap.xml).
#   서치콘솔·서치어드바이저에서 종류마다 색인 비율을 보려고(09-27 판정). 주소는 그대로 · 파일 +8.
[outputFormats.smposts]
  mediaType = "application/xml"
  baseName = "sitemap-posts"
  notAlternative = true
[outputFormats.smhubs]
  mediaType = "application/xml"
  baseName = "sitemap-hubs"
  notAlternative = true
[outputFormats.smdividend]
  mediaType = "application/xml"
  baseName = "sitemap-dividend"
  notAlternative = true
[outputFormats.smearnings]
  mediaType = "application/xml"
  baseName = "sitemap-earnings"
  notAlternative = true
[outputFormats.smoutlook]
  mediaType = "application/xml"
  baseName = "sitemap-outlook"
  notAlternative = true
[outputFormats.smtarget]
  mediaType = "application/xml"
  baseName = "sitemap-target"
  notAlternative = true
[outputFormats.smsignals]
  mediaType = "application/xml"
  baseName = "sitemap-signals"
  notAlternative = true
[outputFormats.smetc]
  mediaType = "application/xml"
  baseName = "sitemap-etc"
  notAlternative = true

[outputs]
  home = ["html", "rss", "search", "smposts", "smhubs", "smdividend", "smearnings", "smoutlook", "smtarget", "smsignals", "smetc"]
  # ★2026-09-13 섹션·분류 RSS 를 끈다 — 종목 허브마다 index.xml 이 하나씩 붙어 배포 파일(상한 20,000)을 먹었다(주식 451개).
  #   크론 워커·네이버 RSS 제출은 홈 index.xml 만 쓴다.
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

# ★2026-09-11 — 헤더 메뉴를 이름으로 못박는다.
#   전에는 섹션 nav + 글 + 카테고리(term)를 자동으로 늘어놔서 "종목 · 신호 · 글 · 차트 신호 · 종목 실측"
#   처럼 같은 말이 두 번씩 나갔다. 카테고리는 /categories/ 에서 닿는다(푸터 "주제별").
#   ⛔코인 사이트는 이 블록이 없다 — 헤더가 옛 자동 방식(카테고리 = 리플·비트코인…)으로 떨어진다.
#   identifier = 섹션 이름. header.html 이 지금 페이지의 .Section 과 대 보고 aria-current 를 단다.
[menus]
  [[menus.main]]
    identifier = "종목"
    name = "종목별 실측"
    url = "/종목/"
    weight = 10
  [[menus.main]]
    identifier = "업종"
    name = "업종별 종목"
    url = "/업종/"
    weight = 15
  [[menus.main]]
    identifier = "신호"
    name = "신호별 실측"
    url = "/신호/"
    weight = 20
  [[menus.main]]
    identifier = "자동매매"
    name = "자동매매"
    url = "/자동매매/"
    weight = 25
  [[menus.main]]
    identifier = "posts"
    name = "글"
    url = "/posts/"
    weight = 30

[taxonomies]
  category = "categories"
  tag = "tags"
