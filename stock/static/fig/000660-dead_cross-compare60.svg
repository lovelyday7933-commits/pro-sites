<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
<rect width="760" height="320" fill="#FFFFFF"/>
<text x="28" y="27" font-size="15.5" font-weight="700" fill="#1F2937">SK하이닉스 · 데드크로스 — 60일 뒤 수익률 중앙값</text>
<text x="28" y="48" font-size="11.5" fill="#667085">막대 = 수익률 중앙값(%) · 막대 아래 = 오른 비율과 표본 수</text>
<text x="120" y="94" font-size="12" text-anchor="end" fill="#1F2937">신호 뒤 60일</text>
<rect x="130.0" y="78" width="524.0" height="22" fill="#C6403F" rx="2"/>
<text x="662.0" y="94" font-size="12.5" font-weight="700" fill="#1F2937">+6.37%</text>
<text x="131.0" y="114" font-size="11" fill="#667085">오른 비율 58.3% · 표본 60회</text>
<text x="120" y="152" font-size="12" text-anchor="end" fill="#1F2937">같은 기간 아무 날</text>
<rect x="130.0" y="136" width="298.6" height="22" fill="#9AA1AB" rx="2"/>
<text x="436.6" y="152" font-size="12.5" font-weight="700" fill="#1F2937">+3.63%</text>
<text x="131.0" y="172" font-size="11" fill="#667085">오른 비율 55.9% · 표본 7,307회</text>
<line x1="28" y1="210" x2="732" y2="210" stroke="#E6E8EC"/>
<text x="28" y="236" font-size="12.5" font-weight="700" fill="#2E6BD6">내린 경우 25회 (41.7%)</text>
<text x="28" y="258" font-size="11.5" fill="#667085">가장 나빴던 경우 -65.73% · 하위 25% -16.51% · 상위 25% +25.43%</text>
<text x="28" y="306" font-size="9.5" fill="#9AA1AB">자료 = 일봉 1996.12.26~2026.07.31 · 거래대금이 얇은 날과 제도상 불가능한 변동일 제외</text>
</svg>