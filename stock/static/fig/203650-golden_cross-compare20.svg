<text x="138.0" y="152" font-size="12.5" font-weight="700" fill="#1F2937">-0.66%</text>
<text x="25.2" y="172" font-size="11" fill="#667085">오른 비율 47.5% · 표본 2,406회</text>
<line x1="28" y1="210" x2="732" y2="210" stroke="#E6E8EC"/>
<text x="28" y="236" font-size="12.5" font-weight="700" fill="#2E6BD6">내린 경우 9회 (39.1%)</text>
<text x="28" y="258" font-size="11.5" fill="#667085">가장 나빴던 경우 -46.55% · 하위 25% -10.58% · 상위 25% +14.74%</text>
<text x="28" y="306" font-size="9.5" fill="#9AA1AB">자료 = 일봉 2014.10.13~2026.09.08 · 거래대금이 얇은 날과 제도상 불가능한 변동일 제외</text>
</svg>