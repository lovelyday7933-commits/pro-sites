<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="10" y="27" font-size="16" font-weight="700" fill="#1F2937">골든크로스와 데드크로스</text>
<text x="10" y="47" font-size="12" fill="#667085">짧은 선이 긴 선을 아래에서 위로 지나가면 골든, 위에서 아래로 지나가면 데드입니다</text>
<polyline points="60,252 140,236 220,219 300,201 380,187 460,181 540,187 620,201 690,219" fill="none" stroke="#9CA3AF" stroke-width="2.6"/>
<polyline points="60,292 140,252 220,182 300,142 380,122 460,152 540,212 620,266 690,300" fill="none" stroke="#1F2937" stroke-width="2.6"/>
<text x="700" y="223" font-size="11" fill="#9CA3AF">긴 선</text>
<text x="700" y="304" font-size="11" fill="#1F2937">짧은 선</text>
<circle cx="190" cy="227" r="16" fill="none" stroke="#C6403F" stroke-width="2"/>
<text x="190" y="201" font-size="12.5" text-anchor="middle" fill="#C6403F" font-weight="700">골든크로스</text>
<circle cx="566" cy="197" r="16" fill="none" stroke="#2E6BD6" stroke-width="2"/>
<text x="566" y="171" font-size="12.5" text-anchor="middle" fill="#2E6BD6" font-weight="700">데드크로스</text>
<text x="30" y="352" font-size="12.5" fill="#667085">짧은 선이 긴 선을 넘으려면 이미 상당히 올라 있어야 합니다. 신호는 늘 오른 뒤에 나옵니다.</text>
<text x="10" y="386" font-size="11.5" fill="#667085">MACD가 0선을 위로 넘는 것이 곧 골든크로스입니다. 같은 것을 다르게 그린 것입니다.</text>
</svg>