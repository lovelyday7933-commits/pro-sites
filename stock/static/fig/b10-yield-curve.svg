<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">장단기 금리차 — 가장 유명한 침체 경보기</text>
  <text x="40" y="54" font-size="12" fill="#667085">만기별 국채 금리를 이은 곡선(수익률 곡선)의 두 얼굴</text>
  <!-- two panels -->
  <g>
    <rect x="40" y="80" width="340" height="230" rx="10" fill="#FFFFFF" stroke="#E6E8EC"/>
    <text x="210" y="108" font-size="13" font-weight="bold" fill="#1F6E43" text-anchor="middle">정상 (우상향)</text>
    <line x1="80" y1="270" x2="350" y2="270" stroke="#9AA1AB" stroke-width="1.2"/>
    <line x1="80" y1="270" x2="80" y2="130" stroke="#9AA1AB" stroke-width="1.2"/>
    <path d="M 80 250 C 150 225, 230 195, 350 165" fill="none" stroke="#1F6E43" stroke-width="3" stroke-linecap="round"/>
    <g font-size="10.5" fill="#667085" text-anchor="middle">
      <text x="110" y="288">3개월</text><text x="205" y="288">2년</text><text x="330" y="288">10년</text>
    </g>
    <text x="210" y="240" font-size="11" fill="#4B5563" text-anchor="middle">오래 빌려줄수록 이자를 더 받음</text>
    <text x="210" y="260" font-size="11" fill="#667085" text-anchor="middle">= 건강한 상태</text>
    <rect x="396" y="80" width="340" height="230" rx="10" fill="#FDFAFA" stroke="#C6403F" stroke-width="1.3"/>
    <text x="566" y="108" font-size="13" font-weight="bold" fill="#C6403F" text-anchor="middle">역전 (우하향)</text>
    <line x1="436" y1="270" x2="706" y2="270" stroke="#9AA1AB" stroke-width="1.2"/>
    <line x1="436" y1="270" x2="436" y2="130" stroke="#9AA1AB" stroke-width="1.2"/>
    <path d="M 436 160 C 510 185, 590 215, 706 235" fill="none" stroke="#C6403F" stroke-width="3" stroke-linecap="round"/>
    <g font-size="10.5" fill="#667085" text-anchor="middle">
      <text x="466" y="288">3개월</text><text x="561" y="288">2년</text><text x="686" y="288">10년</text>
    </g>
    <text x="566" y="240" font-size="11" fill="#4B5563" text-anchor="middle">단기 금리 &gt; 장기 금리</text>
    <text x="566" y="260" font-size="11" fill="#C6403F" text-anchor="middle">= "먼 미래가 지금보다 나쁘다"는 투표</text>
  </g>
  <g font-size="11.5" fill="#1F2937">
    <text x="40" y="348" font-weight="bold">왜 경보인가: 역전은 시장이 "결국 경기가 꺾여 금리를 내리게 될 것"에 돈을 걸고 있다는 뜻입니다.</text>
    <text x="40" y="372" fill="#667085">미국에서 지난 수십 년의 침체 다수가 역전 이후에 왔습니다. 다만 시차가 수개월~2년 이상으로 제각각이었고,</text>
    <text x="40" y="392" fill="#667085">역전이 침체 없이 풀린 논쟁 사례도 있습니다 — 타이밍 도구가 아니라 "경계 수위를 올리는 신호"로 쓰는 것이 바른 용법입니다.</text>
    <text x="40" y="420" fill="#667085">즉시 매도 신호로 오용하면, 역전 이후에도 길게 이어졌던 상승 구간을 통째로 놓친 역사가 있습니다.</text>
  </g>
</svg>
