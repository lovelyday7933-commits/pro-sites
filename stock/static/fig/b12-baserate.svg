<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
<rect width="760" height="420" fill="#FFFFFF"/>
<text x="10" y="27" font-size="16" font-weight="700" fill="#1F2937">비교할 기준이 없으면 어떤 숫자도 뜻이 없습니다</text>
<text x="10" y="47" font-size="12" fill="#667085">신호의 값어치는 '평소보다 나은가'로만 판별됩니다</text>
<text x="300" y="102" font-size="12" text-anchor="end" fill="#667085">수익률 중앙값</text>
<text x="620" y="102" font-size="12" text-anchor="end" fill="#667085">오른 비율</text>
<text x="10" y="125" font-size="13" fill="#1F2937">골든크로스 뒤 60일</text>
<rect x="196" y="107" width="104" height="26" fill="#2E6BD6" opacity="0.75"/>
<text x="188" y="125" font-size="12.5" text-anchor="end" fill="#2E6BD6" font-weight="700">-2.60%</text>
<rect x="360" y="107" width="101" height="26" fill="#2E6BD6" opacity="0.35"/>
<text x="469" y="125" font-size="12.5" fill="#2E6BD6" font-weight="700">43.9%</text>
<text x="10" y="195" font-size="13" fill="#1F2937">평소 60일</text>
<rect x="210" y="177" width="90" height="26" fill="#1F2937" opacity="0.75"/>
<text x="202" y="195" font-size="12.5" text-anchor="end" fill="#1F2937" font-weight="700">-2.24%</text>
<rect x="360" y="177" width="122" height="26" fill="#1F2937" opacity="0.35"/>
<text x="490" y="195" font-size="12.5" fill="#1F2937" font-weight="700">44.7%</text>
<line x1="300" y1="90" x2="300" y2="215" stroke="#E6E8EC" stroke-width="1"/>
<text x="10" y="290" font-size="13" fill="#1F2937" font-weight="700">골든크로스는 중앙값·평균·승률 세 지표 전부에서 평소보다 못했습니다.</text>
<text x="10" y="316" font-size="12.5" fill="#667085">신호 하나만 떼어 놓고 보면 "60일 뒤 -2.60%"라는 숫자가 좋은지 나쁜지 알 수 없습니다.</text>
<text x="10" y="338" font-size="12.5" fill="#667085">같은 종목의 평소와 나란히 놓아야 비로소 판별됩니다.</text>
<text x="10" y="406" font-size="11.5" fill="#667085">한국 주식 390종목 · 5일선×20일선 골든크로스 42,636건 · 유동성 기준 통과분</text>
</svg>