<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
<rect width="760" height="440" fill="#FFFFFF"/>
<text x="10" y="27" font-size="16" font-weight="700" fill="#1F2937">이동평균선은 나눗셈 하나입니다</text>
<text x="10" y="47" font-size="12" fill="#667085">최근 5일 종가를 더해서 5로 나눈 값을, 날마다 밀면서 이어 그립니다</text>
<rect x="44" y="92" width="556" height="62" fill="none" stroke="#B45309" stroke-width="2" rx="6"/>
<rect x="50" y="100" width="84" height="46" fill="none" stroke="#E6E8EC" stroke-width="1.4" rx="4"/>
<text x="92" y="130" font-size="13.5" text-anchor="middle" fill="#1F2937">10,000</text>
<text x="92" y="86" font-size="11" text-anchor="middle" fill="#667085">1일</text>
<rect x="158" y="100" width="84" height="46" fill="none" stroke="#E6E8EC" stroke-width="1.4" rx="4"/>
<text x="200" y="130" font-size="13.5" text-anchor="middle" fill="#1F2937">10,200</text>
<text x="200" y="86" font-size="11" text-anchor="middle" fill="#667085">2일</text>
<rect x="266" y="100" width="84" height="46" fill="none" stroke="#E6E8EC" stroke-width="1.4" rx="4"/>
<text x="308" y="130" font-size="13.5" text-anchor="middle" fill="#1F2937">9,900</text>
<text x="308" y="86" font-size="11" text-anchor="middle" fill="#667085">3일</text>
<rect x="374" y="100" width="84" height="46" fill="none" stroke="#E6E8EC" stroke-width="1.4" rx="4"/>
<text x="416" y="130" font-size="13.5" text-anchor="middle" fill="#1F2937">10,400</text>
<text x="416" y="86" font-size="11" text-anchor="middle" fill="#667085">4일</text>
<rect x="482" y="100" width="84" height="46" fill="none" stroke="#E6E8EC" stroke-width="1.4" rx="4"/>
<text x="524" y="130" font-size="13.5" text-anchor="middle" fill="#1F2937">10,500</text>
<text x="524" y="86" font-size="11" text-anchor="middle" fill="#667085">5일</text>
<rect x="590" y="100" width="84" height="46" fill="none" stroke="#E6E8EC" stroke-width="1.4" rx="4"/>
<text x="632" y="130" font-size="13.5" text-anchor="middle" fill="#667085">10,800</text>
<text x="632" y="86" font-size="11" text-anchor="middle" fill="#667085">6일</text>
<text x="308" y="176" font-size="12.5" text-anchor="middle" fill="#B45309" font-weight="700">이 다섯을 더해서 5로 나눕니다</text>
<text x="30" y="224" font-size="14" fill="#1F2937">10,000 + 10,200 + 9,900 + 10,400 + 10,500 = 51,000</text>
<text x="30" y="252" font-size="14" fill="#1F2937">51,000 ÷ 5 = <tspan font-weight="700" fill="#B45309">10,200원</tspan>   ← 5일선의 오늘 값</text>
<line x1="30" y1="278" x2="730" y2="278" stroke="#E6E8EC" stroke-width="1"/>
<text x="30" y="308" font-size="12.5" fill="#667085">내일이 되면 가장 오래된 10,000원이 빠지고 6일 종가 10,800원이 들어옵니다.</text>
<text x="30" y="336" font-size="14" fill="#1F2937">10,200 + 9,900 + 10,400 + 10,500 + 10,800 = 51,800 · ÷ 5 = <tspan font-weight="700" fill="#B45309">10,360원</tspan></text>
<text x="30" y="368" font-size="12.5" fill="#667085">이렇게 하루씩 밀면서 계산한 값을 이으면 선이 됩니다.</text>
<text x="10" y="426" font-size="11.5" fill="#667085">가상의 예시입니다. 20일선이면 같은 방식으로 20개를 더해 20으로 나눕니다.</text>
</svg>