<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Malgun Gothic, 맑은 고딕, sans-serif">
<rect width="760" height="470" fill="#FFFFFF"/>
<text x="10" y="27" font-size="16" font-weight="700" fill="#1F2937">봉 하나의 구조</text>
<text x="10" y="47" font-size="12" fill="#667085">몸통은 시가와 종가 사이, 꼬리는 그날 가격이 다녀온 범위입니다</text>
<line x1="150" y1="350.0" x2="600" y2="350.0" stroke="#F0F1F3" stroke-width="1"/>
<text x="140" y="354.0" font-size="11" text-anchor="end" fill="#667085">9,700</text>
<line x1="150" y1="290.0" x2="600" y2="290.0" stroke="#F0F1F3" stroke-width="1"/>
<text x="140" y="294.0" font-size="11" text-anchor="end" fill="#667085">10,000</text>
<line x1="150" y1="190.0" x2="600" y2="190.0" stroke="#F0F1F3" stroke-width="1"/>
<text x="140" y="194.0" font-size="11" text-anchor="end" fill="#667085">10,500</text>
<line x1="150" y1="130.0" x2="600" y2="130.0" stroke="#F0F1F3" stroke-width="1"/>
<text x="140" y="134.0" font-size="11" text-anchor="end" fill="#667085">10,800</text>
<line x1="300" y1="130.0" x2="300" y2="350.0" stroke="#C6403F" stroke-width="2.5"/>
<rect x="270.0" y="190.0" width="60" height="100.0" fill="#C6403F"/>
<line x1="332" y1="130.0" x2="392" y2="130.0" stroke="#667085" stroke-width="1"/>
<circle cx="332" cy="130.0" r="3" fill="#667085"/>
<text x="400" y="134.0" font-size="12" fill="#1F2937">고가 — 그날 가장 높았던 가격</text>
<line x1="332" y1="190.0" x2="392" y2="190.0" stroke="#667085" stroke-width="1"/>
<circle cx="332" cy="190.0" r="3" fill="#667085"/>
<text x="400" y="194.0" font-size="12" fill="#1F2937">종가 — 그날 마지막 가격</text>
<line x1="332" y1="290.0" x2="392" y2="290.0" stroke="#667085" stroke-width="1"/>
<circle cx="332" cy="290.0" r="3" fill="#667085"/>
<text x="400" y="294.0" font-size="12" fill="#1F2937">시가 — 그날 첫 가격</text>
<line x1="332" y1="350.0" x2="392" y2="350.0" stroke="#667085" stroke-width="1"/>
<circle cx="332" cy="350.0" r="3" fill="#667085"/>
<text x="400" y="354.0" font-size="12" fill="#1F2937">저가 — 그날 가장 낮았던 가격</text>
<line x1="248" y1="190.0" x2="248" y2="290.0" stroke="#B45309" stroke-width="2"/>
<text x="238" y="244.0" font-size="12" text-anchor="end" fill="#B45309" font-weight="700">몸통</text>
<line x1="248" y1="130.0" x2="248" y2="190.0" stroke="#667085" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="238" y="164.0" font-size="11" text-anchor="end" fill="#667085">위꼬리</text>
<line x1="248" y1="290.0" x2="248" y2="350.0" stroke="#667085" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="238" y="324.0" font-size="11" text-anchor="end" fill="#667085">아래꼬리</text>
<text x="300" y="425" font-size="12" text-anchor="middle" fill="#C6403F" font-weight="700">종가 &gt; 시가 → 빨간 봉(양봉)</text>
<text x="10" y="456" font-size="11.5" fill="#667085">가상의 예시입니다. 한국 차트는 종가가 시가보다 높으면 빨강, 낮으면 파랑입니다.</text>
</svg>