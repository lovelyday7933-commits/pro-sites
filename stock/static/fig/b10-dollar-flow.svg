<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">달러가 세지면 무슨 일이 생기나</text>
  <text x="40" y="54" font-size="12" fill="#667085">달러 강세(DXY 상승 · 원달러 상승)의 전파 경로</text>
  <rect x="290" y="74" width="180" height="48" rx="10" fill="#8C6D1F"/>
  <text x="380" y="104" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">달러 강세</text>
  <g stroke="#8C6D1F" stroke-width="1.8">
    <line x1="330" y1="122" x2="180" y2="160"/><polygon points="176,162 186,163 182,154" fill="#8C6D1F"/>
    <line x1="430" y1="122" x2="580" y2="160"/><polygon points="584,162 574,154 578,163" fill="#8C6D1F"/>
  </g>
  <!-- Korea lane -->
  <g>
    <rect x="60" y="166" width="280" height="76" rx="10" fill="#FFFDF5" stroke="#8C6D1F" stroke-width="1.4"/>
    <text x="200" y="192" font-size="12" font-weight="bold" fill="#8C6D1F" text-anchor="middle">코스피 경로</text>
    <text x="200" y="214" font-size="11" fill="#4B5563" text-anchor="middle">원화 약세 → 외국인의 한국 주식 평가액이</text>
    <text x="200" y="232" font-size="11" fill="#4B5563" text-anchor="middle">달러 기준으로 깎임 → 이탈 압력·수급 악화</text>
    <line x1="200" y1="242" x2="200" y2="278" stroke="#8C6D1F" stroke-width="1.8"/><polygon points="200,282 195,273 205,273" fill="#8C6D1F"/>
    <rect x="90" y="286" width="220" height="48" rx="10" fill="#F8F4E6" stroke="#8C6D1F" stroke-width="1.5"/>
    <text x="200" y="315" font-size="12" font-weight="bold" fill="#8C6D1F" text-anchor="middle">코스피 수급 압박</text>
  </g>
  <!-- crypto lane -->
  <g>
    <rect x="420" y="166" width="280" height="76" rx="10" fill="#FFFDF5" stroke="#8C6D1F" stroke-width="1.4"/>
    <text x="560" y="192" font-size="12" font-weight="bold" fill="#8C6D1F" text-anchor="middle">코인 경로</text>
    <text x="560" y="214" font-size="11" fill="#4B5563" text-anchor="middle">달러 강세는 대개 글로벌 긴축·위험회피 국면 —</text>
    <text x="560" y="232" font-size="11" fill="#4B5563" text-anchor="middle">유동성이 마르면 위험자산 끝단부터 빠짐</text>
    <line x1="560" y1="242" x2="560" y2="278" stroke="#8C6D1F" stroke-width="1.8"/><polygon points="560,282 555,273 565,273" fill="#8C6D1F"/>
    <rect x="450" y="286" width="220" height="48" rx="10" fill="#F8F4E6" stroke="#8C6D1F" stroke-width="1.5"/>
    <text x="560" y="315" font-size="12" font-weight="bold" fill="#8C6D1F" text-anchor="middle">코인 유동성 위축</text>
  </g>
  <g font-size="11.5" fill="#1F2937">
    <text x="40" y="378" font-weight="bold">기억할 상관: "달러 강세 = 위험자산 역풍"이 역사적 경향이었습니다 (기계 법칙은 아님).</text>
    <text x="40" y="402" fill="#667085">수출 기업엔 원화 약세가 이익에 순풍이 되는 반대 효과도 있어, 종목 레벨에서는 명암이 갈립니다.</text>
    <text x="40" y="422" fill="#667085">달러인덱스(DXY)와 원달러 환율은 매일 시세가 아니라 "추세의 방향"으로 보는 것이 실용적입니다.</text>
  </g>
</svg>
