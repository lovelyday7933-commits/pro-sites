<text x="120" y="94" font-size="12" text-anchor="end" fill="#1F2937">신호 뒤 60일</text>
<rect x="130.0" y="78" width="524.0" height="22" fill="#C6403F" rx="2"/>
<text x="662.0" y="94" font-size="12.5" font-weight="700" fill="#1F2937">+12.99%</text>
<text x="131.0" y="114" font-size="11" fill="#667085">오른 비율 59.5% · 표본 37회</text>
<text x="120" y="152" font-size="12" text-anchor="end" fill="#1F2937">같은 기간 아무 날</text>
