<text x="120" y="94" font-size="12" text-anchor="end" fill="#1F2937">신호 뒤 20일</text>
<rect x="130.0" y="78" width="524.0" height="22" fill="#C6403F" rx="2"/>
<text x="662.0" y="94" font-size="12.5" font-weight="700" fill="#1F2937">+23.65%</text>
<text x="131.0" y="114" font-size="11" fill="#667085">오른 비율 73.1% · 표본 26회</text>
<text x="120" y="152" font-size="12" text-anchor="end" fill="#1F2937">평소</text>
<rect x="130.0" y="136" width="89.5" height="22" fill="#9AA1AB" rx="2"/>
<text x="227.5" y="152" font-size="12.5" font-weight="700" fill="#1F2937">+4.04%</text>
<text x="131.0" y="172" font-size="11" fill="#667085">오른 비율 58.2% · 표본 378회</text>
<line x1="28" y1="210" x2="732" y2="210" stroke="#E6E8EC"/>
<text x="28" y="236" font-size="12.5" font-weight="700" fill="#2E6BD6">내린 경우 7회 (26.9%)</text>
<text x="28" y="258" font-size="11.5" fill="#667085">가장 나빴던 경우 -18.68% · 하위 25% -6.68% · 상위 25% +36.66%</text>
<text x="28" y="306" font-size="9.5" fill="#9AA1AB">자료 = 일봉 2024.12.19~2026.09.08 · 거래대금이 얇은 날과 제도상 불가능한 변동일 제외</text>
</svg>