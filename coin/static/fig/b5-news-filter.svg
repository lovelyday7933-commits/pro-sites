<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">뉴스 깔때기 — 세 가지 질문만 통과시키십시오</text>
  <text x="40" y="54" font-size="12" fill="#667085">하루에도 수십 개씩 쏟아지는 XRP 소식을 거르는 법</text>
  <!-- funnel top -->
  <rect x="120" y="74" width="520" height="46" rx="8" fill="#F8F9FA" stroke="#9AA1AB" stroke-width="1.3"/>
  <text x="380" y="103" font-size="12.5" fill="#4B5563" text-anchor="middle">제휴설 · 인플루언서 전망 · 커뮤니티 루머 · 공시 · 판결 · 상장 소식 …</text>
  <polygon points="160,120 600,120 540,158 220,158" fill="#E6E8EC" opacity="0.5"/>
  <!-- three question gates -->
  <g>
    <rect x="90" y="170" width="185" height="96" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="182" y="198" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">① 수요를 바꾸는가</text>
    <text x="182" y="222" font-size="11" fill="#4B5563" text-anchor="middle">실제 결제·송금 사용량,</text>
    <text x="182" y="240" font-size="11" fill="#4B5563" text-anchor="middle">ETF 자금 유입 같은</text>
    <text x="182" y="258" font-size="11" fill="#4B5563" text-anchor="middle">"사는 이유"의 변화인가</text>
    <rect x="288" y="170" width="185" height="96" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="380" y="198" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">② 공급을 바꾸는가</text>
    <text x="380" y="222" font-size="11" fill="#4B5563" text-anchor="middle">에스크로·물량 이동·</text>
    <text x="380" y="240" font-size="11" fill="#4B5563" text-anchor="middle">대량 매각처럼 "파는 쪽"</text>
    <text x="380" y="258" font-size="11" fill="#4B5563" text-anchor="middle">구조의 변화인가</text>
    <rect x="486" y="170" width="185" height="96" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="578" y="198" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">③ 지위를 바꾸는가</text>
    <text x="578" y="222" font-size="11" fill="#4B5563" text-anchor="middle">판결·규제·제도권 승인처럼</text>
    <text x="578" y="240" font-size="11" fill="#4B5563" text-anchor="middle">자산의 법적·제도적</text>
    <text x="578" y="258" font-size="11" fill="#4B5563" text-anchor="middle">위치의 변화인가</text>
  </g>
  <!-- outcomes -->
  <polygon points="300,276 460,276 420,310 340,310" fill="#E6E8EC" opacity="0.5"/>
  <rect x="250" y="320" width="260" height="54" rx="10" fill="#EFF4FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="380" y="343" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">셋 중 하나라도 "예" → 원문 확인</text>
  <text x="380" y="363" font-size="11" fill="#4B5563" text-anchor="middle">공시·판결문·온체인 데이터 등 1차 출처로</text>
  <rect x="546" y="320" width="184" height="54" rx="10" fill="#F8F9FA" stroke="#9AA1AB" stroke-width="1.3"/>
  <text x="638" y="343" font-size="12.5" font-weight="bold" fill="#667085" text-anchor="middle">셋 다 "아니오" → 소음</text>
  <text x="638" y="363" font-size="11" fill="#9AA1AB" text-anchor="middle">시간을 쓰지 않는다</text>
  <text x="40" y="412" font-size="11.5" fill="#667085">"유명인이 언급했다", "차트가 심상치 않다", "커뮤니티가 들썩인다"는 대부분 세 관문을 하나도 통과하지 못합니다.</text>
  <text x="40" y="432" font-size="11.5" fill="#667085">확정 전 루머는 "사실이 되면 그때 행동해도 늦지 않은가"를 기준으로 처리하십시오. 대부분 늦지 않습니다.</text>
</svg>
