<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Malgun Gothic">
  <rect width="760" height="480" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">셋은 서로 다릅니다 — 솔라나 재단, 솔라나 랩스, SOL 자산과 검증인</text>
  <text x="40" y="56" font-size="12" fill="#667085">이 구분이 안 되면 "FTX 코인"·"솔라나 회사" 같은 말부터 어긋납니다</text>
  <!-- top: foundation -->
  <rect x="225" y="80" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.8"/>
  <text x="380" y="108" font-size="13.5" font-weight="bold" fill="#0E7490" text-anchor="middle">솔라나 재단 (Foundation) — 스위스 비영리</text>
  <text x="380" y="132" font-size="11.5" fill="#4B5563" text-anchor="middle">하는 일 — 검증인 지원 · 보조금 · 행사</text>
  <text x="380" y="152" font-size="11.5" fill="#4B5563" text-anchor="middle">안 하는 일 — 네트워크 소유 · SOL 가격 관리</text>
  <!-- bottom-left: labs -->
  <rect x="40" y="256" width="310" height="96" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.8"/>
  <text x="195" y="284" font-size="13.5" font-weight="bold" fill="#0E7490" text-anchor="middle">솔라나 랩스 · 개발사들</text>
  <text x="195" y="308" font-size="11.5" fill="#4B5563" text-anchor="middle">하는 일 — 클라이언트 개발 · 개선 제안(SIMD)</text>
  <text x="195" y="328" font-size="11.5" fill="#4B5563" text-anchor="middle">안 하는 일 — 원장 단독 수정 · 네트워크 소유</text>
  <!-- bottom-right: asset -->
  <rect x="410" y="256" width="310" height="96" rx="10" fill="#E8F5F7" stroke="#0E7490" stroke-width="2"/>
  <text x="565" y="284" font-size="13.5" font-weight="bold" fill="#0E7490" text-anchor="middle">SOL 자산과 검증인 — 내가 사는 것</text>
  <text x="565" y="308" font-size="11.5" fill="#4B5563" text-anchor="middle">하는 일 — 수수료 지불 · 스테이킹 담보 · 표결</text>
  <text x="565" y="328" font-size="11.5" fill="#4B5563" text-anchor="middle">안 하는 일 — 회사 지분 · 배당 · 주주 의결권</text>
  <!-- relation lines -->
  <g stroke="#9AA1AB" stroke-width="1.5">
    <line x1="300" y1="176" x2="215" y2="252"/>
    <line x1="460" y1="176" x2="545" y2="252"/>
    <line x1="350" y1="304" x2="410" y2="304"/>
  </g>
  <g font-size="11" fill="#667085">
    <text x="120" y="216">소프트웨어 개발 지원</text>
    <text x="520" y="216">일부 SOL 보유 (공개)</text>
    <text x="380" y="246" text-anchor="middle">개선 제안은 스테이크 표결로 채택된다</text>
  </g>
  <g font-size="11.8" fill="#1F2937">
    <text x="40" y="384" font-weight="bold">이 구분이 만드는 독해의 차이:</text>
    <text x="40" y="408">"솔라나 랩스가 무엇을 발표했다" = 회사 뉴스 → 그 변화가 원장에 반영되려면 검증인 표결과 실제 적용이 남아 있고,</text>
    <text x="40" y="426">"재단이 SOL을 옮겼다" = 운영 뉴스 → 규모와 목적은 원장에서 따로 확인합니다. 회사의 성공 ≠ SOL의 성공.</text>
  </g>
  <text x="40" y="456" font-size="11.5" fill="#667085">단골 오독 — "FTX 코인" · "멈추는 체인" · "밈코인 체인" · "이더리움 킬러" · 재단 물량 소문</text>
</svg>
