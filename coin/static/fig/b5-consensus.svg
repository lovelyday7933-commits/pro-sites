<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="420" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">채굴 없는 블록체인 — XRPL의 합의 방식</text>
  <text x="40" y="54" font-size="12" fill="#667085">비트코인(작업증명)과의 구조 비교</text>
  <!-- BTC card -->
  <rect x="40" y="80" width="330" height="240" rx="10" fill="#FFF9F2" stroke="#C2570A" stroke-width="1.5"/>
  <text x="60" y="110" font-size="13.5" font-weight="bold" fill="#C2570A">비트코인 — 작업증명(PoW)</text>
  <g font-size="11.8" fill="#1F2937">
    <text x="60" y="142">기록 권한: 퍼즐을 먼저 푼 채굴자</text>
    <text x="60" y="168">확정 속도: 약 10분 + 여러 번의 확인</text>
    <text x="60" y="194">비용: 막대한 전력·장비 (보안의 원천)</text>
    <text x="60" y="220">신규 발행: 채굴 보상으로 계속 발행</text>
  </g>
  <text x="60" y="258" font-size="11.5" fill="#667085">전력이라는 실물 비용이 조작을</text>
  <text x="60" y="276" font-size="11.5" fill="#667085">경제적으로 불가능하게 만드는 설계</text>
  <!-- XRPL card -->
  <rect x="390" y="80" width="330" height="240" rx="10" fill="#EFF4FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="410" y="110" font-size="13.5" font-weight="bold" fill="#1D4ED8">XRPL — 합의 프로토콜</text>
  <g font-size="11.8" fill="#1F2937">
    <text x="410" y="142">기록 권한: 검증인들의 압도적 다수 동의</text>
    <text x="410" y="168">확정 속도: 3~5초</text>
    <text x="410" y="194">비용: 저전력 (일반 서버 수준)</text>
    <text x="410" y="220">신규 발행: 없음 — 1,000억 개 전량 사전 발행</text>
  </g>
  <text x="410" y="258" font-size="11.5" fill="#667085">신뢰할 검증인 목록을 각 노드가 선택 —</text>
  <text x="410" y="276" font-size="11.5" fill="#667085">"충분히 탈중앙적인가"는 지금도 논쟁 주제</text>
  <g font-size="11.8" fill="#1F2937">
    <text x="40" y="356" font-weight="bold">서로 다른 목적의 설계입니다: 비트코인은 "아무도 못 바꾸는 돈"에, XRPL은 "빠르고 싼 결제"에 최적화됐습니다.</text>
    <text x="40" y="382" fill="#667085" font-size="11.5">어느 쪽이 우월하냐의 문제가 아니라, 내가 보유한 자산이 어떤 약속 위에 서 있는지 아는 것이 홀더의 기본기입니다.</text>
  </g>
</svg>
