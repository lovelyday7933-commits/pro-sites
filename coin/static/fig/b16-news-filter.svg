<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="Malgun Gothic">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">뉴스 깔때기 — 세 문항만 통과시키십시오</text>
  <text x="40" y="54" font-size="12" fill="#667085">유난히 빠르고 유난히 많은 솔라나 소식을 거르는 법</text>
  <!-- funnel top -->
  <rect x="120" y="74" width="520" height="46" rx="8" fill="#F8F9FA" stroke="#9AA1AB" stroke-width="1.3"/>
  <text x="380" y="103" font-size="12.5" fill="#4B5563" text-anchor="middle">"또 멈췄다" 캡처 · 밈코인 급등락 · SIMD 제안 · 언락 달력 · 재단 발표 · 법원 기일 …</text>
  <polygon points="160,120 600,120 540,158 220,158" fill="#E6E8EC" opacity="0.5"/>
  <!-- three question gates -->
  <g>
    <rect x="90" y="170" width="185" height="96" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="182" y="198" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">① 확정인가</text>
    <text x="182" y="222" font-size="11" fill="#4B5563" text-anchor="middle">탐색기의 슬롯 진행,</text>
    <text x="182" y="240" font-size="11" fill="#4B5563" text-anchor="middle">검증인 투표 결과,</text>
    <text x="182" y="258" font-size="11" fill="#4B5563" text-anchor="middle">법원·재단 공식 문서인가</text>
    <rect x="288" y="170" width="185" height="96" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="380" y="198" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">② 구조를 바꾸나</text>
    <text x="380" y="222" font-size="11" fill="#4B5563" text-anchor="middle">합의와 안정성(2장),</text>
    <text x="380" y="240" font-size="11" fill="#4B5563" text-anchor="middle">법적 지위(5장), 수요(6장),</text>
    <text x="380" y="258" font-size="11" fill="#4B5563" text-anchor="middle">물량(7장)에 닿는가</text>
    <rect x="486" y="170" width="185" height="96" rx="10" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="578" y="198" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">③ 시점은 언제인가</text>
    <text x="578" y="222" font-size="11" fill="#4B5563" text-anchor="middle">언락 달력, 활성화 에폭,</text>
    <text x="578" y="240" font-size="11" fill="#4B5563" text-anchor="middle">법원 기일처럼 날짜가</text>
    <text x="578" y="258" font-size="11" fill="#4B5563" text-anchor="middle">붙어 있는 소식인가</text>
  </g>
  <!-- outcomes -->
  <polygon points="300,276 460,276 420,310 340,310" fill="#E6E8EC" opacity="0.5"/>
  <rect x="30" y="320" width="480" height="54" rx="10" fill="#EFF4FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="270" y="343" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">셋을 다 통과 → 1차 출처로 확인</text>
  <text x="270" y="363" font-size="11" fill="#4B5563" text-anchor="middle">네트워크 상태 페이지·탐색기·SIMD 저장소·법원 문서</text>
  <rect x="530" y="320" width="200" height="54" rx="10" fill="#F8F9FA" stroke="#9AA1AB" stroke-width="1.3"/>
  <text x="630" y="343" font-size="12.5" font-weight="bold" fill="#667085" text-anchor="middle">하나라도 걸리면 → 소음</text>
  <text x="630" y="363" font-size="11" fill="#9AA1AB" text-anchor="middle">시간을 쓰지 않는다</text>
  <text x="40" y="412" font-size="11.5" fill="#667085">프로토콜 변경은 제안·통과·활성화가 서로 다른 사실입니다. "확정"이라는 문장은 셋 중 어디를 가리키는지부터 물으십시오.</text>
  <text x="40" y="432" font-size="11.5" fill="#667085">시간이 없을 때는 세 번째 문항 하나만 써도 됩니다. 시점이 흐린 소식은 앞의 둘도 대개 통과하지 못합니다.</text>
</svg>
