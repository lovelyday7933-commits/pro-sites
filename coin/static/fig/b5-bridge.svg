<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="460" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">브리지 자산 — 서로 다른 통화 사이의 다리</text>
  <text x="40" y="54" font-size="12" fill="#667085">국제송금 예시: 원화(KRW) → 멕시코 페소(MXN)</text>
  <!-- legacy row -->
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#4B5563">기존 방식 (중개은행 체인)</text>
  <g>
    <rect x="40"  y="106" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1.4"/>
    <text x="110" y="128" font-size="12.5" fill="#1F2937" text-anchor="middle">송금 은행</text>
    <text x="110" y="146" font-size="11.5" fill="#667085" text-anchor="middle">KRW</text>
    <rect x="220" y="106" width="140" height="52" rx="8" fill="#F8F9FA" stroke="#9AA1AB" stroke-width="1.4"/>
    <text x="290" y="128" font-size="12.5" fill="#1F2937" text-anchor="middle">중개은행 1</text>
    <text x="290" y="146" font-size="11.5" fill="#667085" text-anchor="middle">수수료 + 시간</text>
    <rect x="400" y="106" width="140" height="52" rx="8" fill="#F8F9FA" stroke="#9AA1AB" stroke-width="1.4"/>
    <text x="470" y="128" font-size="12.5" fill="#1F2937" text-anchor="middle">중개은행 2</text>
    <text x="470" y="146" font-size="11.5" fill="#667085" text-anchor="middle">수수료 + 시간</text>
    <rect x="580" y="106" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1.4"/>
    <text x="650" y="128" font-size="12.5" fill="#1F2937" text-anchor="middle">수취 은행</text>
    <text x="650" y="146" font-size="11.5" fill="#667085" text-anchor="middle">MXN</text>
    <g stroke="#9AA1AB" stroke-width="1.6">
      <line x1="180" y1="132" x2="216" y2="132"/><polygon points="220,132 211,127 211,137" fill="#9AA1AB"/>
      <line x1="360" y1="132" x2="396" y2="132"/><polygon points="400,132 391,127 391,137" fill="#9AA1AB"/>
      <line x1="540" y1="132" x2="576" y2="132"/><polygon points="580,132 571,127 571,137" fill="#9AA1AB"/>
    </g>
  </g>
  <text x="40" y="188" font-size="11.5" fill="#667085">며칠씩 걸리고, 단계마다 수수료가 붙고, 현지 계좌에 미리 돈을 쌓아둬야(프리펀딩) 합니다.</text>
  <!-- XRP row -->
  <text x="40" y="240" font-size="13" font-weight="bold" fill="#1D4ED8">XRP 브리지 방식</text>
  <g>
    <rect x="40"  y="254" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="130" y="278" font-size="12.5" fill="#1F2937" text-anchor="middle">송금 기관</text>
    <text x="130" y="298" font-size="11.5" fill="#667085" text-anchor="middle">KRW → XRP 매수</text>
    <rect x="290" y="254" width="180" height="60" rx="8" fill="#EFF4FF" stroke="#1D4ED8" stroke-width="1.8"/>
    <text x="380" y="278" font-size="12.5" font-weight="bold" fill="#1D4ED8" text-anchor="middle">XRP Ledger 전송</text>
    <text x="380" y="298" font-size="11.5" fill="#667085" text-anchor="middle">3~5초, 소액 수수료 소각</text>
    <rect x="540" y="254" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6"/>
    <text x="630" y="278" font-size="12.5" fill="#1F2937" text-anchor="middle">수취 기관</text>
    <text x="630" y="298" font-size="11.5" fill="#667085" text-anchor="middle">XRP 매도 → MXN 지급</text>
    <g stroke="#1D4ED8" stroke-width="1.8">
      <line x1="220" y1="284" x2="286" y2="284"/><polygon points="290,284 281,279 281,289" fill="#1D4ED8"/>
      <line x1="470" y1="284" x2="536" y2="284"/><polygon points="540,284 531,279 531,289" fill="#1D4ED8"/>
    </g>
  </g>
  <text x="40" y="346" font-size="11.5" fill="#667085">XRP가 두 통화 사이에서 잠깐 다리 역할만 하고 즉시 팔리는 구조(ODL)입니다. 프리펀딩이 필요 없어집니다.</text>
  <text x="40" y="404" font-size="11.5" fill="#667085">유의: 이것은 설계 목적의 설명이지, 실제 송금 시장에서의 채택 규모와는 별개 문제입니다.</text>
  <text x="40" y="424" font-size="11.5" fill="#667085">채택 규모는 확인된 발표·데이터로만 판단해야 합니다.</text>
</svg>
