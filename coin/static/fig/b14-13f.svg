<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Malgun Gothic">
  <rect width="760" height="470" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">13F 공시가 보여 주는 것과 보여 주지 않는 것 — 비트코인 ETF 판</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#667085">미국 상장 증권을 1억 달러 이상 운용하는 기관이 분기 말 롱 포지션을 45일 안에 신고하는 제도</text>
  <!-- left: shows -->
  <rect x="40" y="86" width="330" height="200" rx="10" fill="#F6F8FB" stroke="#E6E8EC"/>
  <rect x="40" y="86" width="330" height="6" fill="#C2570A"/>
  <text x="205" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">보여 주는 것</text>
  <g font-size="12" fill="#1F2937">
    <text x="60" y="152">· 분기 말 시점의 롱 포지션 — 현물 ETF 주식 수 · 평가액</text>
    <text x="60" y="176">· 신고 기관의 이름 (운용 규모 1억 달러 이상)</text>
    <text x="60" y="200">· 어느 ETF에 얼마씩 나뉘어 있는지</text>
    <text x="60" y="224">· 분기를 이어 보면 늘렸는지 줄였는지</text>
  </g>
  <text x="60" y="262" font-size="11.5" fill="#667085">일정 — 6월 30일 보유분은 8월 14일까지 제출 (45일 시차)</text>
  <!-- right: doesn't -->
  <rect x="390" y="86" width="330" height="200" rx="10" fill="#F6F8FB" stroke="#E6E8EC"/>
  <rect x="390" y="86" width="330" height="6" fill="#2E6BD6"/>
  <text x="555" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">보여 주지 않는 것</text>
  <g font-size="12" fill="#1F2937">
    <text x="410" y="152">· 공매도 · 선물 · 옵션 매도 — 반대 포지션은 신고 밖</text>
    <text x="410" y="176">· 분기 사이의 매매 — 기준일과 제출일 사이 45일</text>
    <text x="410" y="200">· 개인 · 해외 기관 · 1억 달러 미만 운용사의 보유</text>
    <text x="410" y="224">· 보유 목적(고객 주문 · 헤지 · 회사 자산)과 가격 전망</text>
  </g>
  <text x="410" y="262" font-size="11.5" fill="#667085">ETF 밖의 보유(직접 보유 · 수탁 보관)는 13F에 아예 없다</text>
  <!-- timeline -->
  <line x1="60" y1="340" x2="700" y2="340" stroke="#E6E8EC" stroke-width="3"/>
  <g fill="#C2570A"><circle cx="120" cy="340" r="7"/><circle cx="380" cy="340" r="7"/><circle cx="640" cy="340" r="7"/></g>
  <g font-size="12" fill="#1F2937" text-anchor="middle" font-weight="bold">
    <text x="120" y="372">기준일</text><text x="380" y="372">제출</text><text x="640" y="372">보도·해석</text>
  </g>
  <g font-size="11.5" fill="#667085" text-anchor="middle">
    <text x="120" y="390">분기 말 (6월 30일)</text><text x="380" y="390">45일 안 (8월 14일)</text><text x="640" y="390">그 뒤 몇 주 (9월)</text>
  </g>
  <rect x="40" y="416" width="680" height="1" fill="#E6E8EC"/>
  <text x="40" y="440" font-size="11.5" fill="#667085">읽는 법 — "기관이 샀다"는 분기 말 ETF 주식의 롱 포지션까지다. 헤지됐는지, 지금도 들고 있는지는 공시가 답하지 않는다.</text>
  <text x="40" y="458" font-size="11.5" fill="#667085">확인할 것은 둘 — 다음 분기 13F(계속 보유인가)와 ETF 순유입(통로로 돈이 계속 오는가). 둘 다 가격 전망은 아니다.</text>
</svg>
