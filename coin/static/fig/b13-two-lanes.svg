<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Malgun Gothic">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">두 결제망 — 은행 컨소시엄과 개방형 스테이블코인</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#667085">겨냥하는 시장은 일부 겹치고 대부분 갈린다 (2026년 9월 발표 기준)</text>
  <!-- left lane -->
  <rect x="40" y="90" width="300" height="230" rx="10" fill="#F6F8FB" stroke="#E6E8EC"/>
  <rect x="40" y="90" width="300" height="6" fill="#3F4A5C"/>
  <text x="190" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">은행 컨소시엄 · 허가형</text>
  <text x="190" y="146" text-anchor="middle" font-size="11.5" fill="#667085">골드만삭스 · MUFG 등 21개 금융기관</text>
  <text x="60" y="180" font-size="12" fill="#1F2937">· 참여자를 제한하는 폐쇄형 블록체인</text>
  <text x="60" y="204" font-size="12" fill="#1F2937">· 내부 정산 · 대기업 간 거래 · 은행 간 감사</text>
  <text x="60" y="228" font-size="12" fill="#1F2937">· 유동성 · 규제 준수 · 수수료를 내부 통제</text>
  <text x="60" y="252" font-size="12" fill="#1F2937">· 2026년 하반기 합작법인 → 2027년 상반기 발행 목표</text>
  <text x="60" y="290" font-size="11.5" fill="#667085">걸림돌 — 21개 기관의 내부 규칙·거버넌스 합의</text>
  <!-- right lane -->
  <rect x="420" y="90" width="300" height="230" rx="10" fill="#F6F8FB" stroke="#E6E8EC"/>
  <rect x="420" y="90" width="300" height="6" fill="#0B5FA5"/>
  <text x="570" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">개방형 스테이블코인</text>
  <text x="570" y="146" text-anchor="middle" font-size="11.5" fill="#667085">RLUSD · USDC 등 규제 승인형</text>
  <text x="440" y="180" font-size="12" fill="#1F2937">· 누구나 접근하는 공개 원장(XRPL 등)</text>
  <text x="440" y="204" font-size="12" fill="#1F2937">· 핀테크 · 소매 결제 · 디파이</text>
  <text x="440" y="228" font-size="12" fill="#1F2937">· 빠른 도입 · 낮은 조정 비용</text>
  <text x="440" y="252" font-size="12" fill="#1F2937">· 이미 유통량과 사용처를 쌓는 중</text>
  <text x="440" y="290" font-size="11.5" fill="#667085">걸림돌 — 준비자산 · 상환 능력 · 각국 규제</text>
  <!-- overlap -->
  <line x1="340" y1="205" x2="420" y2="205" stroke="#E6E8EC" stroke-width="2"/>
  <rect x="345" y="190" width="70" height="30" rx="15" fill="#FFFFFF" stroke="#E6E8EC"/>
  <text x="380" y="210" text-anchor="middle" font-size="11" fill="#667085">일부 겹침</text>
  <!-- bottom -->
  <rect x="40" y="345" width="680" height="1" fill="#E6E8EC"/>
  <text x="40" y="372" font-size="11.5" fill="#667085">시장의 관측 — 은행 연합은 대기업 사이의 도매 결제망에, 개방형 코인은 핀테크·디파이에 머물며 양분될 가능성.</text>
  <text x="40" y="392" font-size="11.5" fill="#667085">홀더의 독법 — "은행이 스테이블코인을 낸다"는 경쟁의 신호이자, 블록체인 결제가 전통 금융이 외면하기 어려운 시장이 됐다는 신호.</text>
  <text x="40" y="412" font-size="11.5" fill="#667085">단, 컨소시엄의 출시 시점은 목표이지 사실이 아니다 — 최신 공지를 확인할 것.</text>
</svg>
