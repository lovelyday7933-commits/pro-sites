<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Malgun Gothic">
  <rect width="760" height="520" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">물량은 누가 들고 있나 — 보유 주체의 구성</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#667085">개념도 — 가로 길이는 상대 크기만 나타냅니다. 숫자를 읽는 그림이 아닙니다</text>
  <text x="60" y="92" font-size="13" font-weight="bold" fill="#1F2937">유통 중인 전체 물량을 성격별로 나누면</text>
  <!-- stacked bar -->
  <rect x="60" y="104" width="245" height="56" fill="#C2570A"/>
  <rect x="305" y="104" width="105" height="56" fill="#2E6BD6"/>
  <rect x="410" y="104" width="110" height="56" fill="#F2C4A0"/>
  <rect x="520" y="104" width="65" height="56" fill="#3F4A5C"/>
  <rect x="585" y="104" width="115" height="56" fill="#C6CBD2"/>
  <rect x="60" y="104" width="640" height="56" fill="none" stroke="#E6E8EC"/>
  <g text-anchor="middle" font-size="12" font-weight="bold">
    <text x="182" y="137" fill="#FFFFFF">장기 보유</text>
    <text x="357" y="137" fill="#FFFFFF">거래소 잔고</text>
    <text x="465" y="137" fill="#1F2937">ETF · 수탁</text>
    <text x="552" y="137" fill="#FFFFFF">트레저리</text>
    <text x="642" y="137" fill="#1F2937">분실 추정</text>
  </g>
  <!-- table header -->
  <rect x="40" y="176" width="680" height="30" fill="#F6F8FB"/>
  <g font-size="12" font-weight="bold" fill="#1F2937">
    <text x="76" y="196">구성</text><text x="250" y="196">무엇을 세는가 · 어떻게 잡히나</text>
  </g>
  <!-- rows -->
  <rect x="58" y="216" width="11" height="11" fill="#C2570A"/>
  <text x="76" y="226" font-size="12" font-weight="bold" fill="#1F2937">장기 보유</text>
  <text x="250" y="226" font-size="11.5" fill="#667085">오랜 기간 움직이지 않은 주소의 물량 — 기준 기간은 분석사마다 다르다</text>
  <line x1="40" y1="240" x2="720" y2="240" stroke="#E6E8EC"/>

  <rect x="58" y="254" width="11" height="11" fill="#2E6BD6"/>
  <text x="76" y="264" font-size="12" font-weight="bold" fill="#1F2937">거래소 잔고</text>
  <text x="250" y="264" font-size="11.5" fill="#667085">거래소로 알려진 주소에 남아 있는 물량 — 주소 태그는 분석사의 추정</text>
  <line x1="40" y1="278" x2="720" y2="278" stroke="#E6E8EC"/>

  <rect x="58" y="292" width="11" height="11" fill="#F2C4A0" stroke="#C6CBD2"/>
  <text x="76" y="302" font-size="12" font-weight="bold" fill="#1F2937">ETF · 수탁</text>
  <text x="250" y="302" font-size="11.5" fill="#667085">현물 ETF와 기관 수탁이 대신 보관하는 물량 — 운용사 공시로 확인된다</text>
  <line x1="40" y1="316" x2="720" y2="316" stroke="#E6E8EC"/>

  <rect x="58" y="330" width="11" height="11" fill="#3F4A5C"/>
  <text x="76" y="340" font-size="12" font-weight="bold" fill="#1F2937">기업 · 국가 트레저리</text>
  <text x="250" y="340" font-size="11.5" fill="#667085">기업 재무제표 · 정부 공시에 잡히는 보유 — 공시 주기가 제각각이다</text>
  <line x1="40" y1="354" x2="720" y2="354" stroke="#E6E8EC"/>

  <rect x="58" y="368" width="11" height="11" fill="#C6CBD2"/>
  <text x="76" y="378" font-size="12" font-weight="bold" fill="#1F2937">분실 추정</text>
  <text x="250" y="378" font-size="11.5" fill="#667085">열쇠를 잃어 되살릴 수 없다고 보는 물량 — 증명은 불가능하고 전부 추정이다</text>

  <rect x="40" y="402" width="680" height="1" fill="#E6E8EC"/>
  <text x="40" y="426" font-size="12" font-weight="bold" fill="#1F2937">비율은 분석사마다 산출 조건이 다릅니다.</text>
  <text x="40" y="448" font-size="11.5" fill="#667085">칸끼리 겹칩니다 — 분실 추정분은 장기 미이동 물량 안에 들어가 있는 경우가 많고, 어디까지를 분실로 볼지 기준이 제각각입니다.</text>
  <text x="40" y="468" font-size="11.5" fill="#667085">거래소 잔고와 ETF · 수탁은 "누구 것인가"가 아니라 "누가 대신 보관하는가"의 구분입니다 — 보관처가 바뀌면 칸도 같이 바뀝니다.</text>
  <text x="40" y="488" font-size="11.5" fill="#667085">확인하는 곳 — 운용사 · 기업 · 정부 공시는 1차 출처이고, 온체인 추정치는 산출 조건을 같이 놓고 읽습니다.</text>
</svg>
