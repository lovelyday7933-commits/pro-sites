<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Malgun Gothic">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">RLUSD가 쓰이는 네 자리 — 결제 · 수탁 · 대출 · 신흥국</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#667085">리플 측 발표(2026년 8~9월) 기준 — 사용처의 존재와 규모는 따로 확인한다</text>
  <!-- center -->
  <circle cx="380" cy="225" r="54" fill="#F6F8FB" stroke="#0B5FA5" stroke-width="2"/>
  <text x="380" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">RLUSD</text>
  <text x="380" y="239" text-anchor="middle" font-size="10.5" fill="#667085">달러 1:1 담보</text>
  <!-- spokes -->
  <g stroke="#E6E8EC" stroke-width="2">
    <line x1="326" y1="205" x2="200" y2="140"/><line x1="434" y1="205" x2="560" y2="140"/>
    <line x1="326" y1="245" x2="200" y2="310"/><line x1="434" y1="245" x2="560" y2="310"/>
  </g>
  <!-- four boxes -->
  <g font-size="12" fill="#1F2937">
    <rect x="40" y="100" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E6E8EC"/>
    <text x="140" y="124" text-anchor="middle" font-weight="bold">토큰화 자산 결제</text>
    <text x="140" y="146" text-anchor="middle" font-size="11.5" fill="#667085">ZILO · Licuido 전략 투자</text>
    <text x="140" y="164" text-anchor="middle" font-size="11.5" fill="#667085">토큰화 자산 거래의 현금성 결제 수단</text>
    <rect x="520" y="100" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E6E8EC"/>
    <text x="620" y="124" text-anchor="middle" font-weight="bold">거래소 수탁</text>
    <text x="620" y="146" text-anchor="middle" font-size="11.5" fill="#667085">바이비트 · 11일 만에 5,000만 달러</text>
    <text x="620" y="164" text-anchor="middle" font-size="11.5" fill="#667085">보유·활용 프로그램 2단계</text>
    <rect x="40" y="270" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E6E8EC"/>
    <text x="140" y="294" text-anchor="middle" font-weight="bold">기관 대출</text>
    <text x="140" y="316" text-anchor="middle" font-size="11.5" fill="#667085">Clearpool Finance · Cicada Credit</text>
    <text x="140" y="334" text-anchor="middle" font-size="11.5" fill="#667085">핀테크·결제회사 대상 신용 자산</text>
    <rect x="520" y="270" width="200" height="80" rx="8" fill="#FFFFFF" stroke="#E6E8EC"/>
    <text x="620" y="294" text-anchor="middle" font-weight="bold">신흥국 결제</text>
    <text x="620" y="316" text-anchor="middle" font-size="11.5" fill="#667085">케냐 중소기업 보험·신용 접근</text>
    <text x="620" y="334" text-anchor="middle" font-size="11.5" fill="#667085">결제 시간 97% 단축(리플 측)</text>
  </g>
  <rect x="40" y="378" width="680" height="1" fill="#E6E8EC"/>
  <text x="40" y="402" font-size="11.5" fill="#667085">읽는 법 — 시가총액(20억 달러 돌파 · 2026년 9월)보다 사용처가 함께 늘고 있는가. 스테이블코인의 경쟁력은 가격이 아니라</text>
  <text x="40" y="420" font-size="11.5" fill="#667085">준비자산 · 상환 능력 · 유통망 · 실제 채택이다. 그리고 RLUSD의 성장이 곧 XRP 수요는 아니다.</text>
</svg>
