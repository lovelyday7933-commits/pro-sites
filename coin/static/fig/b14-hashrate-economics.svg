<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Malgun Gothic">
  <rect width="760" height="540" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">채굴자의 손익 구조 — 수입은 프로토콜이 정하고, 비용은 시장이 정한다</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#667085">개념도 — 실제 금액이 아니라 상대 크기 · 블록 보상은 2024년 4월 네 번째 반감기 이후 3.125 BTC</text>
  <!-- section labels -->
  <text x="60" y="92" font-size="13" font-weight="bold" fill="#C2570A">수입 — BTC로 받는다</text>
  <text x="520" y="92" font-size="13" font-weight="bold" fill="#3F4A5C">비용 — 법정통화로 낸다</text>
  <!-- bar A: before halving -->
  <rect x="80" y="170" width="110" height="30" fill="#F2C4A0"/>
  <rect x="80" y="200" width="110" height="200" fill="#C2570A" opacity="0.88"/>
  <text x="135" y="190" text-anchor="middle" font-size="11" fill="#1F2937">수수료</text>
  <text x="135" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">블록 보상</text>
  <text x="135" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">6.25 BTC</text>
  <!-- bar B: after halving -->
  <rect x="250" y="270" width="110" height="30" fill="#F2C4A0"/>
  <rect x="250" y="300" width="110" height="100" fill="#C2570A" opacity="0.88"/>
  <text x="305" y="290" text-anchor="middle" font-size="11" fill="#1F2937">수수료</text>
  <text x="305" y="343" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">블록 보상</text>
  <text x="305" y="363" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">3.125 BTC</text>
  <!-- halving arrow: old top level and drop -->
  <line x1="190" y1="170" x2="370" y2="170" stroke="#C6CBD2" stroke-width="1" stroke-dasharray="3 4"/>
  <g stroke="#667085" stroke-width="2" fill="none">
    <path d="M305 178 L305 258 M299 250 L305 258 L311 250"/>
  </g>
  <text x="372" y="196" font-size="12" font-weight="bold" fill="#1F2937">반감기</text>
  <text x="372" y="213" font-size="11.5" fill="#667085">블록 보상만 절반 (6.25 → 3.125)</text>
  <text x="372" y="230" font-size="11.5" fill="#667085">210,000블록마다 · 약 4년 주기</text>
  <!-- income-after level guide -->
  <line x1="360" y1="270" x2="540" y2="270" stroke="#2E6BD6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#2E6BD6">반감기 후 수입의 높이</text>
  <text x="450" y="288" text-anchor="middle" font-size="11" fill="#667085">비용이 이 선을 넘으면 멈춘다</text>
  <!-- bar C: cost -->
  <rect x="540" y="215" width="110" height="25" fill="#E6E8EC" stroke="#C6CBD2"/>
  <rect x="540" y="240" width="110" height="50" fill="#C6CBD2"/>
  <rect x="540" y="290" width="110" height="110" fill="#9AA1AB"/>
  <text x="595" y="232" text-anchor="middle" font-size="10.5" fill="#1F2937">운영 · 인건비</text>
  <text x="595" y="269" text-anchor="middle" font-size="12" fill="#1F2937">기기 감가</text>
  <text x="595" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">전기</text>
  <text x="595" y="359" text-anchor="middle" font-size="11" fill="#FFFFFF">가장 큰 몫</text>
  <!-- baseline & captions -->
  <line x1="60" y1="400" x2="720" y2="400" stroke="#9AA1AB" stroke-width="1.2"/>
  <g font-size="12" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="135" y="422">반감기 전</text>
    <text x="305" y="422">반감기 후</text>
    <text x="595" y="422">비용 — 반감기와 무관</text>
  </g>
  <rect x="40" y="442" width="680" height="1" fill="#E6E8EC"/>
  <text x="40" y="466" font-size="12" font-weight="bold" fill="#1F2937">해시레이트 = 네트워크에 투입된 계산력의 총합 — 채굴자들이 전기와 기기를 얼마나 걸었는지의 합계</text>
  <text x="40" y="488" font-size="11.5" fill="#667085">읽는 법 — 반감기는 정해진 날 수입의 절반을 깎지만 비용은 그대로다. 수입이 비용 아래로 내려간 채굴기부터 멈추고,</text>
  <text x="40" y="506" font-size="11.5" fill="#667085">약 2주(2,016블록) 뒤 난이도 조정이 남은 채굴자의 몫을 다시 맞춘다. 수입은 BTC로, 비용은 법정통화로 — 가격이 손익을 가른다.</text>
  <text x="40" y="524" font-size="11.5" fill="#667085">수수료 몫은 블록마다 다르다 — 거래가 몰리면 두꺼워지고 한산하면 얇아진다. 그 비율에 확정된 숫자는 없다.</text>
</svg>
