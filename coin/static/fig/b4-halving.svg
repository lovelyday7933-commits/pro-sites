<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="320" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">반감기 — 약 4년마다 새 공급이 절반이 됩니다</text>
  <text x="40" y="54" font-size="12" fill="#667085">블록 하나를 캘 때 채굴자가 받는 보상(BTC)의 변화</text>
  <!-- timeline -->
  <line x1="70" y1="180" x2="710" y2="180" stroke="#9AA1AB" stroke-width="2"/>
  <!-- nodes x: 100, 220, 340, 460, 580, 686 -->
  <g>
    <circle cx="100" cy="180" r="7" fill="#C2570A"/>
    <circle cx="220" cy="180" r="7" fill="#C2570A"/>
    <circle cx="340" cy="180" r="7" fill="#C2570A"/>
    <circle cx="460" cy="180" r="7" fill="#C2570A"/>
    <circle cx="580" cy="180" r="7" fill="#C2570A"/>
    <circle cx="686" cy="180" r="7" fill="#FFFFFF" stroke="#C2570A" stroke-width="2.5"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#1F2937" text-anchor="middle">
    <text x="100" y="150">2009.1</text>
    <text x="220" y="150">2012.11</text>
    <text x="340" y="150">2016.7</text>
    <text x="460" y="150">2020.5</text>
    <text x="580" y="150">2024.4</text>
    <text x="686" y="150">2028 (예정)</text>
  </g>
  <g font-size="11.5" fill="#667085" text-anchor="middle">
    <text x="100" y="130">제네시스 블록</text>
    <text x="220" y="130">1차 반감기</text>
    <text x="340" y="130">2차 반감기</text>
    <text x="460" y="130">3차 반감기</text>
    <text x="580" y="130">4차 반감기</text>
    <text x="686" y="130">5차 반감기</text>
  </g>
  <g font-size="13.5" font-weight="bold" fill="#C2570A" text-anchor="middle">
    <text x="100" y="216">50</text>
    <text x="220" y="216">25</text>
    <text x="340" y="216">12.5</text>
    <text x="460" y="216">6.25</text>
    <text x="580" y="216">3.125</text>
    <text x="686" y="216">1.5625</text>
  </g>
  <text x="380" y="240" font-size="11.5" fill="#667085" text-anchor="middle">블록당 보상 (BTC)</text>
  <text x="40" y="284" font-size="11.5" fill="#667085">공급 증가 속도가 절반이 되는 이벤트가 예고된 일정표대로 옵니다. 수요가 같다면 새 물량의 압력은 줄어드는 구조 —</text>
  <text x="40" y="302" font-size="11.5" fill="#667085">다만 "반감기 = 상승"의 표본은 서너 번뿐이라, 구조로 이해하되 공식으로 맹신하지 않는 균형이 필요합니다.</text>
</svg>
