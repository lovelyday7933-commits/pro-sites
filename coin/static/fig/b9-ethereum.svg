<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="430" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">이더리움 — 돈이 아니라 "판"을 깝니다</text>
  <text x="40" y="54" font-size="12" fill="#667085">비트코인이 디지털 금이라면, 이더리움은 앱이 올라가는 디지털 땅</text>
  <!-- stack -->
  <g text-anchor="middle">
    <rect x="120" y="90" width="520" height="66" rx="10" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
    <text x="380" y="117" font-size="12.5" font-weight="bold" fill="#0E7490">응용 계층 — 위에 올라간 앱들</text>
    <text x="380" y="140" font-size="11" fill="#4B5563">디파이(금융) · NFT(소유권) · 게임 · 스테이블코인 발행 등</text>
    <rect x="120" y="168" width="520" height="66" rx="10" fill="#EDF7FA" stroke="#0E7490" stroke-width="1.8"/>
    <text x="380" y="195" font-size="12.5" font-weight="bold" fill="#0E7490">스마트 컨트랙트 — 조건이 맞으면 자동 실행되는 계약</text>
    <text x="380" y="218" font-size="11" fill="#4B5563">"A가 입금하면 B에게 소유권 이전" 같은 규칙이 코드로 박혀 사람 없이 굴러감</text>
    <rect x="120" y="246" width="520" height="66" rx="10" fill="#0E7490"/>
    <text x="380" y="273" font-size="12.5" font-weight="bold" fill="#FFFFFF">기반 계층 — 이더리움 네트워크 (합의·보안)</text>
    <text x="380" y="296" font-size="11" fill="#D7F1F8">2022년 9월 '머지'로 채굴(PoW) → 지분증명(PoS) 전환</text>
  </g>
  <!-- gas note -->
  <g>
    <line x1="660" y1="200" x2="700" y2="200" stroke="#9AA1AB" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="704" y="188" font-size="11" fill="#667085" transform="rotate(90 704 188)"> </text>
  </g>
  <g font-size="11.8" fill="#1F2937">
    <text x="40" y="352" font-weight="bold">가스비: 이 판 위에서 무언가를 실행할 때마다 내는 통행료 — ETH로 지불됩니다.</text>
    <text x="40" y="376" fill="#667085">ETH 수요의 뿌리가 여기 있습니다: 판이 붐빌수록 통행료 수요가 늘어납니다. ETH 투자는 "이 땅 위에 건물이 계속 올라가는가"에 대한 판단과 같습니다.</text>
    <text x="40" y="412" fill="#667085">반대로 앱 생태계가 식거나 경쟁 플랫폼으로 이주가 일어나면 수요의 근거도 함께 약해집니다 — 양방향 모두 보아야 합니다.</text>
  </g>
</svg>
