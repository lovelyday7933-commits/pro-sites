<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Malgun Gothic, sans-serif">
  <rect width="760" height="400" fill="#FFFFFF"/>
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#1F2937">블록은 사슬로 묶여 있어 과거를 고칠 수 없습니다</text>
  <text x="40" y="54" font-size="12" fill="#667085">각 블록은 앞 블록의 지문(해시)을 품고 태어납니다</text>
  <!-- blocks -->
  <g>
    <rect x="60" y="100" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C2570A" stroke-width="1.8"/>
    <text x="150" y="128" font-size="13" font-weight="bold" fill="#C2570A" text-anchor="middle">블록 #100</text>
    <text x="150" y="154" font-size="11.5" fill="#4B5563" text-anchor="middle">거래 기록 묶음</text>
    <rect x="80" y="170" width="140" height="30" rx="5" fill="#FFF3E8"/>
    <text x="150" y="190" font-size="11" fill="#C2570A" text-anchor="middle">내 지문: 7f3a…</text>
    <rect x="290" y="100" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C2570A" stroke-width="1.8"/>
    <text x="380" y="128" font-size="13" font-weight="bold" fill="#C2570A" text-anchor="middle">블록 #101</text>
    <text x="380" y="154" font-size="11.5" fill="#4B5563" text-anchor="middle">앞 블록 지문: 7f3a…</text>
    <rect x="310" y="170" width="140" height="30" rx="5" fill="#FFF3E8"/>
    <text x="380" y="190" font-size="11" fill="#C2570A" text-anchor="middle">내 지문: c91d…</text>
    <rect x="520" y="100" width="180" height="120" rx="10" fill="#FFFFFF" stroke="#C2570A" stroke-width="1.8"/>
    <text x="610" y="128" font-size="13" font-weight="bold" fill="#C2570A" text-anchor="middle">블록 #102</text>
    <text x="610" y="154" font-size="11.5" fill="#4B5563" text-anchor="middle">앞 블록 지문: c91d…</text>
    <rect x="540" y="170" width="140" height="30" rx="5" fill="#FFF3E8"/>
    <text x="610" y="190" font-size="11" fill="#C2570A" text-anchor="middle">내 지문: 2b8e…</text>
    <g stroke="#C2570A" stroke-width="2.2">
      <line x1="240" y1="160" x2="286" y2="160"/><polygon points="290,160 281,155 281,165" fill="#C2570A"/>
      <line x1="470" y1="160" x2="516" y2="160"/><polygon points="520,160 511,155 511,165" fill="#C2570A"/>
    </g>
  </g>
  <!-- tamper scenario -->
  <rect x="60" y="252" width="660" height="94" rx="8" fill="#FDF7F7" stroke="#C6403F" stroke-width="1.3"/>
  <text x="80" y="280" font-size="12.5" font-weight="bold" fill="#C6403F">블록 #100의 거래 하나를 몰래 고치면?</text>
  <text x="80" y="304" font-size="11.8" fill="#1F2937">#100의 지문이 통째로 달라짐 → #101이 품은 "앞 블록 지문"과 불일치 → #102도 연쇄 불일치 →</text>
  <text x="80" y="326" font-size="11.8" fill="#1F2937">전 세계 수만 개의 원본 장부와 달라 즉시 들통. 조작하려면 그 뒤 모든 블록을 전 세계보다 빨리 다시 캐야 합니다.</text>
  <text x="40" y="378" font-size="11.5" fill="#667085">"위조 불가"는 마법이 아니라 이 사슬 구조 + 막대한 채굴 비용이 만드는 경제적 사실입니다.</text>
</svg>
