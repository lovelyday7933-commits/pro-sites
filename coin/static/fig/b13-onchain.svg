<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Malgun Gothic">
  <rect width="760" height="440" fill="#FFFFFF"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F2937">온체인에서 보이는 것과 보이지 않는 것</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#667085">이동은 보이고, 의도는 안 보인다</text>
  <!-- example flow -->
  <text x="60" y="96" font-size="13" font-weight="bold" fill="#1F2937">사례 — 2026년 9월 초 리플 에스크로 (코인게이프 · 웨일 얼럿 · XRPL 데이터)</text>
  <g font-size="12" fill="#1F2937" text-anchor="middle">
    <rect x="60" y="112" width="180" height="60" rx="8" fill="#F6F8FB" stroke="#E6E8EC"/><text x="150" y="137" font-weight="bold">에스크로 해제</text><text x="150" y="157" font-size="11.5" fill="#667085">10억 XRP (5억+4억+1억)</text>
    <rect x="290" y="112" width="180" height="60" rx="8" fill="#F6F8FB" stroke="#0B5FA5"/><text x="380" y="137" font-weight="bold">재예치</text><text x="380" y="157" font-size="11.5" fill="#667085">7억 XRP · 약 9억 5,200만 달러</text>
    <rect x="520" y="112" width="180" height="60" rx="8" fill="#F6F8FB" stroke="#E6E8EC"/><text x="610" y="137" font-weight="bold">리플 관리 지갑</text><text x="610" y="157" font-size="11.5" fill="#667085">3억 XRP · 통상 월별 운영 규모</text>
  </g>
  <g stroke="#667085" stroke-width="2" fill="none"><path d="M240 142 L282 142 M274 136 L282 142 L274 148"/><path d="M470 142 L512 142 M504 136 L512 142 L504 148"/></g>
  <!-- two columns -->
  <rect x="40" y="200" width="330" height="150" rx="10" fill="#F6F8FB" stroke="#E6E8EC"/>
  <rect x="40" y="200" width="330" height="6" fill="#0B5FA5"/>
  <text x="205" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">원장이 보여주는 것</text>
  <g font-size="12" fill="#1F2937">
    <text x="60" y="262">· 어느 주소에서 어느 주소로, 얼마가, 언제</text>
    <text x="60" y="286">· 에스크로의 해제와 재예치 (원장 내장 기능)</text>
    <text x="60" y="310">· 거래소로 알려진 주소의 순유입·순유출</text>
    <text x="60" y="334">· 누적 소각량 · 유통량</text>
  </g>
  <rect x="390" y="200" width="330" height="150" rx="10" fill="#F6F8FB" stroke="#E6E8EC"/>
  <rect x="390" y="200" width="330" height="6" fill="#2E6BD6"/>
  <text x="555" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1F2937">원장이 말해주지 않는 것</text>
  <g font-size="12" fill="#1F2937">
    <text x="410" y="262">· 그 주소의 주인 (표시된 이름은 추정)</text>
    <text x="410" y="286">· 의도 — 매도인지, 계약 이행인지, 보관 이동인지</text>
    <text x="410" y="310">· 가격에 미칠 영향</text>
    <text x="410" y="334">· "고래가 쓸어담는다"는 서사의 진위</text>
  </g>
  <rect x="40" y="374" width="680" height="1" fill="#E6E8EC"/>
  <text x="40" y="398" font-size="11.5" fill="#667085">검증 순서 — ① 알림·기사가 말하는 거래를 원장 탐색기에서 직접 찾는다 ② 해제라면 재예치까지 확인한다</text>
  <text x="40" y="416" font-size="11.5" fill="#667085">③ "매집"이라는 해석은 주소의 주인과 의도가 확인되지 않는 한 해석일 뿐이다. 1분이면 끝나고, 그 1분이 서사와 데이터를 가른다.</text>
</svg>
