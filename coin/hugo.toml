# 사용자 구매 2026-09-08. canonical 은 절대 URL 자기참조여야 한다(SEO 기준).
baseURL = "https://procoin.kr/"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
# 사용자 2026-09-10: "네이밍 프로 주식, 프로 코인 으로 일단 해. 이건 나중에 바꿔도 되잖아."
# ⚠️임시 이름이다. 바꿀 때 여기 한 곳만 고치면 title·og·JSON-LD 저자/발행처가 함께 따라온다.
title = "프로 코인"
themesDir = "../_themes"
theme = "base"

enableGitInfo = false          # ⛔true 로 두면 Actions 에서 fetch-depth:0 이 필요해진다(비용 조항 3번)
enableRobotsTXT = true
buildFuture = false            # publishDate 가 미래면 빌드에서 뺀다 = 예약 발행의 근거
summaryLength = 40

[pagination]
  pagerSize = 12

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  # 네이버 서치어드바이저 소유확인 — ⛔지우면 확인이 풀린다
  naverVerification = "40163bcae369c64bde528d2742b299412ee47c64"
  site = "coin"
  # ★2026-09-13 코인 격자 — 주식과 같은 구조. 검색어(자동완성 1위 "{코인} 시세")를 제목·설명 앞에 둔다.
  headline = "코인 시세 차트 신호 실측"
  tagline = "코인 시세 차트 신호 실측"
  # ⚠️2026-09-09 까지 빈 문자열이었다 = 홈·목록에 meta description 이 아예 없었다.
  description = "비트코인·리플·솔라나 시세 차트에서 골든크로스·RSI·볼린저밴드 같은 신호가 뜬 뒤 실제로 어땠는지, 380여 개 코인의 원화마켓 일봉으로 확인합니다. 가격을 예측하지 않고, 지나간 기록을 숫자로 보여 드립니다."
  # 책 신청 창구 — 사용자 지급 2026-09-08. 사이트마다 다른 양식이라
  # 이 링크 하나로 주식/코인 세그먼트가 갈린다.
  ctaURL = "https://proreport.co.kr/f/c6b7o13b"

  # ★기본 책 안내 — 글이 자기 책을 지정하지 않은 페이지에 붙는다.
  # ⛔반드시 N:1 책이어야 한다. 1:1(종목책)을 기본값으로 깔면 §4 를 어긴다.
  # ⚠️book10 은 config.json 에서 sites=["stock","coin"] 로 코인에 명시 허용된 N:1 이라 골랐다.
  #   사용자가 다른 책을 원하면 여기만 바꾼다.
  # ⛔question 은 두지 않는다 — 템플릿 기본값("더 알아보기")을 쓴다.
  #   조건절로 늘린 문구는 사람이 쓰는 말이 아니다(사용자 2026-09-10).
  [params.defaultCTA]
    book = "경제지표의 기본기"
    note = "금리·환율·유동성이 위험자산에 닿는 경로를 순서대로 정리했습니다."

# ⛔위 [params.defaultCTA] 표 아래에 params 값을 쓰면 defaultCTA 안으로 들어간다 — 표 이름으로 다시 연다.
[params.home]
  # 홈 찾기 칸 아래 바로가기 — 코인 코드. grid.json 에 없는 코드는 템플릿이 건너뛴다.
  quick = ["BTC", "XRP", "ETH", "SOL", "DOGE"]

# /search.json — 코인 찾기 창·홈 점그림 풀이(layouts/index.search.json). 배포 파일 +1.
[outputFormats.search]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "search"]
  # ★2026-09-13 섹션·분류 RSS 를 끈다 — 종목 허브마다 index.xml 이 하나씩 붙어 배포 파일(상한 20,000)을 먹었다(주식 451개).
  #   크론 워커·네이버 RSS 제출은 홈 index.xml 만 쓴다.
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

# ★2026-09-13 헤더 메뉴 — 주식과 같이 이름으로 못박는다. 전에는 카테고리(리플·비트코인…)가 자동으로 메뉴가 됐다.
#   카테고리는 /categories/ 에서 닿는다(푸터 "주제별"). identifier = 섹션 이름.
[menus]
  [[menus.main]]
    identifier = "코인"
    name = "코인별 실측"
    url = "/코인/"
    weight = 10
  [[menus.main]]
    identifier = "신호"
    name = "신호별 실측"
    url = "/신호/"
    weight = 20
  [[menus.main]]
    identifier = "posts"
    name = "글"
    url = "/posts/"
    weight = 30

[taxonomies]
  category = "categories"
  tag = "tags"
